name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run full check suite
        run: npm run prepublishOnly

      - name: Verify tag version matches package.json
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "ERROR: tag version '${TAG_VERSION}' does not match package.json version '${PKG_VERSION}'" >&2
            exit 1
          fi
          echo "Tag version '${TAG_VERSION}' matches package.json version '${PKG_VERSION}'"

      - name: Determine npm tag
        id: tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # Any hyphenated prerelease suffix (alpha, beta, rc) → alpha dist-tag;
          # a clean release (e.g. v0.1.0) → latest.
          if echo "${GITHUB_REF_NAME}" | grep -qE -- '-(alpha|beta|rc)'; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Show determined npm tag
        run: |
          echo "ref: ${{ github.ref_name }}"
          echo "npm tag: ${{ steps.tag.outputs.tag }}"

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
